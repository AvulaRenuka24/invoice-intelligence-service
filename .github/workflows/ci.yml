name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          # Run pytest, capture its exit code
          pytest --ignore=tests/test_qa.py --ignore=tests/test_search.py --ignore=eval --cov --cov-fail-under=0 -v || rc=$?
          rc=${rc:-0}
          if [ "$rc" -eq 5 ]; then
            echo "Pytest collected no tests (exit code 5). Treating as success for now."
            exit 0
          else
            exit $rc
          fi
      
     